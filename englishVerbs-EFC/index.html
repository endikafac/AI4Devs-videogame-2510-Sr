<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <script src="../platform/nav.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Irregular Verbs">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <meta name="description" content="Irregular Verbs — Learn the most common English irregular verbs in 3 levels.">
    <title>Irregular Verbs — Games Hub</title>
    <link rel="stylesheet" href="../platform/platform.css">
    <link rel="stylesheet" href="styles.css">
    <link href="../fonts/fonts.css" rel="stylesheet">
</head>
<body>

<div id="platform-header"></div>

<main id="main-content" tabindex="-1">

<!-- ══ SCREEN 1: HOME ═══════════════════════════════════════ -->
<section id="ev-screen-home" class="ev-screen active" aria-label="Home">
    <div class="ev-page">

        <div class="ev-home-header">
            <h1>🇬🇧 Irregular <span>Verbs</span></h1>
            <p data-i18n="subtitle">Aprende los verbos irregulares del inglés</p>
        </div>

        <!-- Tab bar -->
        <div class="ev-tabs" role="tablist" aria-label="Secciones" data-i18n-aria="tabsAria">
            <button class="ev-tab-btn active" id="ev-tabBtn-tabla"
                role="tab" aria-selected="true" aria-controls="ev-tab-tabla" data-i18n="tabTable">
                📋 Tabla
            </button>
            <button class="ev-tab-btn" id="ev-tabBtn-grupos"
                role="tab" aria-selected="false" aria-controls="ev-tab-grupos" data-i18n="tabGroups">
                🔗 Por grupos
            </button>
            <button class="ev-tab-btn" id="ev-tabBtn-niveles"
                role="tab" aria-selected="false" aria-controls="ev-tab-niveles" data-i18n="tabLevels">
                🎯 Niveles
            </button>
        </div>

        <!-- TAB 1: Tabla -->
        <div class="ev-tab-content active" id="ev-tab-tabla" role="tabpanel" aria-labelledby="ev-tabBtn-tabla">

            <!-- Search -->
            <div class="ev-search-wrap">
                <span class="ev-search-icon" aria-hidden="true">🔍</span>
                <input
                    class="ev-search-input"
                    id="ev-verb-search"
                    type="search"
                    placeholder="Buscar verbo..." data-i18n-ph="searchPh"
                    aria-label="Buscar en la tabla de verbos" data-i18n-aria="searchAria"
                    autocomplete="off">
            </div>

            <!-- Verb reference table (collapsible) -->
            <div class="ev-panel" id="ev-table-panel">
                <button class="ev-panel-toggle" id="ev-table-toggle" aria-expanded="false" aria-controls="ev-table-body">
                    <span><span data-i18n="refTable">Tabla de referencia</span> (<span id="ev-verb-count">70</span> <span data-i18n="verbs">verbos</span>)</span> <span class="ev-toggle-icon">▼</span>
                </button>
                <div class="ev-panel-body" id="ev-table-body" hidden>
                    <div id="ev-verb-table-container"></div>
                </div>
            </div>

        </div>

        <!-- TAB 2: Por grupos -->
        <div class="ev-tab-content" id="ev-tab-grupos" role="tabpanel" aria-labelledby="ev-tabBtn-grupos">
            <div id="ev-group-cards-container"></div>
        </div>

        <!-- TAB 3: Niveles -->
        <div class="ev-tab-content" id="ev-tab-niveles" role="tabpanel" aria-labelledby="ev-tabBtn-niveles">
            <button class="ev-btn ev-btn-secondary ev-lesson-open" id="ev-lesson-open" type="button" data-i18n="lrn_open"></button>
            <p class="ev-section-label" data-i18n="chooseLevel">Choose your level</p>
            <div class="ev-level-grid" id="ev-level-grid" role="list"></div>

            <p class="ev-section-label ev-section-spaced" data-i18n="practiceTitle">Modos de práctica</p>
            <div class="ev-filter-row">
                <label for="ev-mode-group" data-i18n="filterLabel">Grupo</label>
                <select id="ev-mode-group" class="ev-select"></select>
            </div>
            <div class="ev-mode-grid" id="ev-mode-grid"></div>
            <p class="ev-kb-tip" data-i18n="kbTip"></p>
        </div>

    </div>
</section>

<!-- ══ SCREEN 2: GAME ═══════════════════════════════════════ -->
<section id="ev-screen-game" class="ev-screen" aria-label="Game" aria-live="polite">
    <div class="ev-page">

        <!-- HUD -->
        <div class="ev-hud">
            <div class="ev-stat">
                <div class="ev-stat-val" id="ev-score-val">0</div>
                <div class="ev-stat-lbl" data-i18n="score">Score</div>
            </div>
            <div class="ev-stat">
                <div class="ev-stat-val" id="ev-progress-val">1/10</div>
                <div class="ev-stat-lbl" data-i18n="progress">Progress</div>
            </div>
            <div class="ev-stat">
                <div class="ev-stat-val" id="ev-streak-val">0</div>
                <div class="ev-stat-lbl" data-i18n="streak">Streak</div>
            </div>
        </div>

        <div class="evd-zonebar"><span class="evd-qn" id="evd-qn"></span><span class="evd-streak" id="evd-streak" aria-hidden="true"></span><button class="evd-helpbtn" id="evd-help" type="button"></button><span id="evd-snd"></span></div>
        <p class="evd-hint" id="evd-hint" role="note" hidden></p>

        <!-- Progress bar -->
        <div class="ev-progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="ev-progress-bar-wrap">
            <div class="ev-progress-fill" id="ev-progress-fill" style="width:0%"></div>
        </div>

        <!-- Level badge -->
        <p class="ev-level-badge" id="ev-level-badge">Level 1 — Matching</p>

        <!-- Dynamic question area — rendered by JS -->
        <div id="ev-question-area"></div>

        <!-- Feedback -->
        <div class="ev-feedback" id="ev-feedback" role="alert" aria-live="assertive" style="display:none"></div>

        <!-- Action row -->
        <div class="ev-action-row">
            <button class="ev-btn ev-btn-primary hidden" id="ev-next-btn" data-i18n="next">Next →</button>
            <button class="ev-btn ev-btn-ghost" id="ev-quit-btn" data-i18n="quit">Quit</button>
        </div>

    </div>
</section>

<!-- ══ SCREEN 2b: LESSON (regular vs irregular) ═════════════ -->
<section id="ev-screen-lesson" class="ev-screen" aria-label="Lesson">
    <div class="ev-page">
        <h2 class="ev-lesson-title" id="ev-lesson-title"></h2>
        <div id="ev-lesson-body"></div>
        <div class="ev-action-row">
            <button class="ev-btn ev-btn-ghost" id="ev-lesson-skip" type="button"></button>
        </div>
    </div>
</section>

<!-- ══ SCREEN 3: RESULTS ════════════════════════════════════ -->
<section id="ev-screen-results" class="ev-screen" aria-label="Results">
    <div class="ev-page">

        <div class="ev-result-card">
            <h2 id="ev-result-title" data-i18n="resultsTitle">Results!</h2>
            <div class="ev-result-stars" id="ev-result-stars">⭐⭐⭐</div>
            <div class="ev-result-big" id="ev-result-score">0</div>
            <div class="ev-result-big-lbl" data-i18n="points">points</div>
            <div class="ev-result-grid">
                <div class="ev-result-item">
                    <div class="ev-result-item-val" id="ev-result-correct">0/0</div>
                    <div class="ev-result-item-lbl" data-i18n="correct">Correct</div>
                </div>
                <div class="ev-result-item">
                    <div class="ev-result-item-val" id="ev-result-time">0:00</div>
                    <div class="ev-result-item-lbl" data-i18n="time">Time</div>
                </div>
                <div class="ev-result-item">
                    <div class="ev-result-item-val" id="ev-result-level">1</div>
                    <div class="ev-result-item-lbl" data-i18n="level">Level</div>
                </div>
            </div>
            <div class="ev-result-btns">
                <button class="ev-btn ev-btn-secondary" id="ev-retry-btn" data-i18n="retry">Try again</button>
                <button class="ev-btn ev-btn-primary" id="ev-next-level-btn" data-i18n="nextLevel">Next level</button>
                <button class="ev-btn ev-btn-ghost" id="ev-menu-btn" data-i18n="menu">Menu</button>
            </div>
        </div>

    </div>
</section>

</main>

<!-- ══ Quit confirmation modal ═══════════════════════════════ -->
<div id="ev-quit-modal" class="ev-modal hidden" role="dialog" aria-modal="true" tabindex="-1">
    <div class="ev-modal-dialog">
        <h3 data-i18n="quitTitle">Quit the exercise?</h3>
        <p data-i18n="quitMsg">Your current progress will be lost.</p>
        <div class="ev-modal-actions">
            <button class="ev-btn ev-btn-secondary" id="ev-quit-cancel" data-i18n="cancel">Cancel</button>
            <button class="ev-btn ev-btn-primary" id="ev-quit-ok" data-i18n="quit">Quit</button>
        </div>
    </div>
</div>

<!-- ══ Scripts ══════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore-compat.js"></script>
<script src="../platform/firebase-config.js"></script>
<script src="../platform/i18n-platform.js"></script>
<script src="../platform/auth.js"></script>
<script src="../platform/firestore.js"></script>
<script src="../platform/identity.js"></script>
<script src="../platform/achievements.js"></script>
<script src="../platform/platform-header.js"></script>
<script src="../platform/juice.js"></script>
<script src="data.js"></script>
<script src="data-extra.js"></script>
<script src="i18n.js"></script>
<script src="learn.js"></script>
<script src="game.js"></script>
<script src="dyn.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    PlatformHeader.init({ gameName: 'Irregular Verbs', gameIcon: '🇬🇧', rootPath: '../' });
    EnglishVerbsGame.init();
});
</script>
    <script src="../platform/register-sw.js"></script>
</body>
</html>
