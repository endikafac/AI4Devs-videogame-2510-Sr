<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Entrar · Games Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="platform/platform.css">
    <link rel="stylesheet" href="styles.css">
    <link href="fonts/fonts.css" rel="stylesheet">
    <style>
        .welcome { max-width: 460px; margin: 0 auto; padding: calc(var(--header-height) + 20px) 16px 40px; display: flex; flex-direction: column; gap: 16px; }
        .welcome-hero { text-align: center; }
        .welcome-hero .big { font-size: 3rem; line-height: 1; }
        .welcome-hero h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 8px 0 4px; }
        .welcome-hero p { margin: 0; color: var(--text-secondary); }
        .wcard { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .wcard h2 { margin: 0; font-size: 1.05rem; }
        .wcard p, .wcard li { margin: 0; color: var(--text-secondary); font-size: .92rem; line-height: 1.5; }
        .wcard ul { margin: 0; padding-left: 20px; }
        .wbtn { width: 100%; }
        .gbtn { background: #fff; color: #1f2937; border: 1px solid #d1d5db; }
        .gbtn svg { width: 20px; height: 20px; }
        .note { font-size: .85rem; color: var(--text-secondary); }
        .note a { color: var(--hub-brand-light); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .me { display: flex; align-items: center; gap: 12px; }
        .me .hub-me-avatar { width: 56px; height: 56px; font-size: 2rem; }
        #err { color: var(--hub-danger); min-height: 1.2em; font-size: .9rem; }
    </style>
</head>
<body>
<main id="main-content" class="welcome" tabindex="-1">
    <div class="welcome-hero">
        <div class="big" aria-hidden="true">🎮</div>
        <h1 id="w-title"></h1>
        <p id="w-sub"></p>
    </div>

    <!-- Signed out -->
    <section id="out" class="wcard-group" hidden style="display:flex;flex-direction:column;gap:16px">
        <div class="wcard">
            <h2 id="g-title"></h2>
            <p id="g-desc"></p>
            <a class="hub-btn wbtn" id="g-go" href="index.html"></a>
        </div>
        <div class="wcard">
            <h2 id="s-title"></h2>
            <ul id="s-list"></ul>
            <button type="button" class="hub-btn wbtn gbtn" id="google-btn">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
                <span id="s-btn"></span>
            </button>
            <p class="note" id="s-note"></p>
            <div id="err" role="alert"></div>
        </div>
    </section>

    <!-- Signed in -->
    <section id="in" class="wcard-group" hidden style="display:flex;flex-direction:column;gap:16px">
        <div class="wcard">
            <div class="me" id="me"></div>
            <a class="hub-btn wbtn" id="play-btn" href="index.html"></a>
            <div class="row">
                <a class="hub-btn ghost" href="platform/stats.html" id="a-stats"></a>
                <a class="hub-btn ghost" href="platform/achievements.html" id="a-ach"></a>
            </div>
            <div class="row">
                <a class="hub-btn ghost" href="platform/privacy.html" id="a-priv"></a>
                <button type="button" class="hub-btn ghost" id="a-out"></button>
            </div>
        </div>
    </section>

    <p class="note" style="text-align:center"><a href="platform/privacy.html" id="priv-link"></a></p>
</main>

<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore-compat.js"></script>
<script src="platform/firebase-config.js"></script>
<script src="platform/i18n-platform.js"></script>
<script src="platform/auth.js"></script>
<script src="platform/firestore.js"></script>
<script src="platform/identity.js"></script>
<script src="platform/platform-header.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    PlatformHeader.init({ gameName: '', gameIcon: '', rootPath: '' });

    const T = {
        'es-ES': {
            title: 'Bienvenido a Games Hub', sub: 'Juegos educativos gratuitos para pequeños y mayores.',
            gTitle: 'Jugar ahora', gDesc: 'Sin cuenta y sin datos personales. Tu progreso se guarda solo en este dispositivo.', gBtn: 'Jugar como invitado',
            sTitle: 'Guardar mi progreso', sBtn: 'Entrar con Google',
            sList: ['Guarda puntos, niveles y logros', 'Continúa en otros dispositivos', 'Aparece en los rankings con un apodo y un avatar'],
            sNote: 'Para adultos y tutores. Si juega un menor, la cuenta debe ser de su padre, madre o tutor. Nunca pedimos nombre real, foto ni email del niño: juega con un apodo inventado.',
            err: 'No se pudo iniciar sesión. Inténtalo de nuevo.', wait: 'Conectando...',
            hi: n => `¡Hola, ${n}!`, level: 'Nivel', play: 'Ir a jugar', stats: '📊 Estadísticas', ach: '🏆 Logros', priv: '🔒 Mis datos', out: 'Cerrar sesión', privLink: 'Privacidad y protección de datos'
        },
        'en-US': {
            title: 'Welcome to Games Hub', sub: 'Free educational games for little ones and grown-ups.',
            gTitle: 'Play now', gDesc: 'No account and no personal data. Your progress is only saved on this device.', gBtn: 'Play as a guest',
            sTitle: 'Save my progress', sBtn: 'Sign in with Google',
            sList: ['Keeps points, levels and achievements', 'Continue on other devices', 'Shows up in rankings with a nickname and an avatar'],
            sNote: 'For adults and guardians. If a child plays, the account must belong to their parent or guardian. We never ask for the child\'s real name, photo or email: they play with a made-up nickname.',
            err: 'Could not sign in. Please try again.', wait: 'Connecting...',
            hi: n => `Hi, ${n}!`, level: 'Level', play: 'Go and play', stats: '📊 Statistics', ach: '🏆 Achievements', priv: '🔒 My data', out: 'Sign out', privLink: 'Privacy and data protection'
        },
        'eu-ES': {
            title: 'Ongi etorri Games Hub-era', sub: 'Joko hezigarri doakoak txikientzat eta nagusientzat.',
            gTitle: 'Jokatu orain', gDesc: 'Konturik eta datu pertsonalik gabe. Zure aurrerapena gailu honetan bakarrik gordetzen da.', gBtn: 'Jokatu gonbidatu gisa',
            sTitle: 'Gorde nire aurrerapena', sBtn: 'Sartu Googlerekin',
            sList: ['Puntuak, mailak eta lorpenak gordetzen ditu', 'Jarraitu beste gailu batzuetan', 'Sailkapenetan ezizen eta avatar batekin agertzen da'],
            sNote: 'Helduentzat eta tutoreentzat. Haur batek jokatzen badu, kontua bere guraso edo tutorearena izan behar da. Ez dugu inoiz eskatzen haurraren benetako izenik, argazkirik edo posta elektronikorik: asmatutako ezizen batekin jokatzen du.',
            err: 'Ezin izan da saioa hasi. Saiatu berriro.', wait: 'Konektatzen...',
            hi: n => `Kaixo, ${n}!`, level: 'Maila', play: 'Jokatzera', stats: '📊 Estatistikak', ach: '🏆 Lorpenak', priv: '🔒 Nire datuak', out: 'Saioa itxi', privLink: 'Pribatutasuna eta datuen babesa'
        }
    };
    const tr = () => T[PlatformI18n.currentLanguage] || T['es-ES'];
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // "next" must be a relative path of this site (no scheme, no //): avoids open redirects.
    const rawNext = new URLSearchParams(location.search).get('next') || '';
    const next = /^[\w\-./]+(\?[\w=&\-]*)?$/.test(rawNext) && !rawNext.startsWith('/') && !rawNext.includes('..') ? rawNext : 'index.html';
    $('g-go').setAttribute('href', next);
    $('play-btn').setAttribute('href', next);

    let profile = null, signedIn = false;
    const pending = { get: () => { try { return sessionStorage.getItem('gh_signin_pending') === '1'; } catch (e) { return false; } },
                      set: v => { try { v ? sessionStorage.setItem('gh_signin_pending', '1') : sessionStorage.removeItem('gh_signin_pending'); } catch (e) {} } };

    function render() {
        const t = tr();
        $('w-title').textContent = signedIn && profile && profile.username ? t.hi(profile.username) : t.title;
        $('w-sub').textContent = t.sub;
        $('g-title').textContent = t.gTitle; $('g-desc').textContent = t.gDesc; $('g-go').textContent = t.gBtn;
        $('s-title').textContent = t.sTitle; $('s-btn').textContent = t.sBtn; $('s-note').textContent = t.sNote;
        $('s-list').innerHTML = t.sList.map(x => `<li>${esc(x)}</li>`).join('');
        $('err').textContent = '';
        $('play-btn').textContent = t.play; $('a-stats').textContent = t.stats; $('a-ach').textContent = t.ach;
        $('a-priv').textContent = t.priv; $('a-out').textContent = t.out; $('priv-link').textContent = t.privLink;
        $('out').hidden = signedIn; $('in').hidden = !signedIn;
        if (signedIn && profile) {
            const level = PlatformFirestore.levelFromXP(profile.xp || 0);
            $('me').innerHTML = `<div class="hub-me-avatar" aria-hidden="true">${esc(profile.avatar || '🙂')}</div>
                <div><div class="hub-me-name">${esc(profile.username || '')}</div>
                <div class="hub-me-meta">${esc(t.level)} ${level} · ⭐ ${(profile.totalPoints || 0).toLocaleString()}</div></div>`;
        }
    }

    PlatformAuth.onAuthStateChanged(u => {
        signedIn = !!u;
        if (!u) profile = null;
        render();
    });
    // After a fresh sign-in (and the nickname/consent step) go back to where the person was.
    document.addEventListener('platformProfileReady', e => {
        profile = e.detail;
        render();
        if (pending.get() && profile && profile.username) { pending.set(false); setTimeout(() => { location.href = next; }, 700); }
    });
    document.addEventListener('platformLanguageChanged', render);

    $('google-btn').addEventListener('click', async () => {
        const btn = $('google-btn');
        if (btn.disabled) return;
        btn.disabled = true;
        pending.set(true);
        $('s-btn').textContent = tr().wait;
        $('err').textContent = '';
        try {
            await PlatformAuth.signInWithGoogle();
        } catch (e) {
            pending.set(false);
            $('err').textContent = tr().err;
        } finally {
            btn.disabled = false;
            $('s-btn').textContent = tr().sBtn;
        }
    });
    $('a-out').addEventListener('click', () => PlatformHeader._signOut());

    render();
});
</script>
<script src="platform/register-sw.js"></script>
</body>
</html>
