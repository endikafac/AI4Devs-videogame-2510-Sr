<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#14b8a6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Memoria de Parejas">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <meta name="description" content="Memoria de Parejas: encuentra las parejas de emojis, animales, números y letras en tres tamaños.">
    <title>Memoria de Parejas – Games Hub</title>
    <link rel="stylesheet" href="../platform/platform.css">
    <link rel="stylesheet" href="styles.css">
    <link href="../fonts/fonts.css" rel="stylesheet">
</head>
<body>
<main id="main-content" class="mm-main">
    <section id="mm-home" class="mm-screen">
        <div class="mm-head">
            <h1 id="mm-h1">Memoria de Parejas</h1>
            <div class="mm-stats" id="mm-stats"></div>
        </div>
        <p class="mm-sub" id="mm-sub"></p>
        <ol class="mm-path" id="mm-path"></ol>
    </section>

    <section id="mm-learn" class="mm-screen" hidden aria-labelledby="mm-learn-title">
        <div class="mm-top">
            <button class="mm-quit" id="mm-learn-back" type="button" aria-label="Salir">✕</button>
            <h2 class="mm-learn-title" id="mm-learn-title"></h2>
        </div>
        <div class="mm-card mm-learncard">
            <p class="mm-prompt" id="mm-learn-text"></p>
            <div id="mm-learn-body"></div>
        </div>
        <div class="mm-endbtns mm-learnbtns">
            <button class="mm-btn" id="mm-learn-go" type="button"></button>
            <button class="mm-btn ghost" id="mm-learn-skip" type="button"></button>
        </div>
    </section>

    <section id="mm-play" class="mm-screen" hidden>
        <div class="mm-top">
            <button class="mm-quit" id="mm-quit" type="button" aria-label="Salir">✕</button>
            <div class="mm-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="mm-barfill"></i></div>
            <span class="mm-count" id="mm-count" aria-live="polite"></span>
        </div>
        <p class="mm-guide" id="mm-guide" hidden aria-live="polite"></p>
        <div class="mm-card" id="mm-card"></div>
        <p class="mm-why" id="mm-why" hidden aria-live="polite"></p>
        <div class="mm-feedback" id="mm-feedback" hidden aria-live="assertive"></div>
    </section>

    <section id="mm-end" class="mm-screen" hidden>
        <div class="mm-endbox">
            <div class="mm-trophy" id="mm-trophy" aria-hidden="true"></div>
            <h2 id="mm-endtitle"></h2>
            <p id="mm-endtext"></p>
            <div class="mm-endstars" id="mm-endstars" aria-hidden="true"></div>
            <div class="mm-endbtns">
                <button class="mm-btn" id="mm-next" type="button"></button>
                <button class="mm-btn ghost" id="mm-back" type="button"></button>
            </div>
        </div>
    </section>
</main>

<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore-compat.js"></script>
<script src="../platform/firebase-config.js"></script>
<script src="../platform/i18n-platform.js"></script>
<script src="../platform/auth.js"></script>
<script src="../platform/firestore.js"></script>
<script src="../platform/identity.js"></script>
<script src="../platform/platform-header.js"></script>
<script src="learn.js"></script>
<script src="game.js"></script>
<script>
    PlatformHeader.init({ gameName: 'Memoria de Parejas', gameIcon: '🃏', rootPath: '../' });
    MemoryPairs.init();
</script>
<script src="../platform/register-sw.js"></script>
</body>
</html>
